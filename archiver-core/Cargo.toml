[package]
name = "archiver_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ядро логики архивации/разархивации для macOS-приложения (Tauri UI поверх этого крейта)"

[lib]
name = "archiver_core"
path = "src/lib.rs"

[dependencies]
# ZIP
zip = { version = "2.2", features = ["deflate", "bzip2", "time"] }

# TAR + сжатие
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"

# 7z (чтение и запись + AES)
sevenz-rust = { version = "0.6", features = ["compress", "aes256"] }

# RAR (только распаковка — формат проприетарный)
unrar = "0.5"

# Общие утилиты
thiserror = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
