[workspace]
resolver = "2"
members = [
    "archiver-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Edward McCain"]

[workspace.dependencies]
thiserror = "1.0"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared release profile for the desktop app binary
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
