[workspace]
resolver = "2"
members = [
    "archiver-core",
    # "src-tauri",  # подключается на этапе Tauri-scaffold
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Edward McCain"]

[workspace.dependencies]
# Shared across crates once src-tauri is added
thiserror = "1.0"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
